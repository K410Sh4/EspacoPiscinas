name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check catalog.js
          node --check app.js
          node --check support.js
          node --check reviews.js
      - name: Verificar arquivos e referências
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s catalog.js
          test -s suporte.html
          test -s support.css
          test -s support.js
          test -s avaliacoes.html
          test -s reviews.css
          test -s reviews.js
          test -s avaliacoes.json
          test -s assets/favicon.svg
          test -s assets/espaco-piscina-logo.svg
          test -s assets/fachada-espaco-piscina.webp
          test -s assets/problemas/agua-verde.webp
          test -s assets/problemas/agua-turva.webp
          test -s assets/problemas/ph-alto.webp
          test -s assets/problemas/ph-baixo.webp
          test -s assets/problemas/manchas-ferrugem.webp
          test -s assets/problemas/bordas-sujas.webp
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class PageChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.scripts = set()
                  self.styles = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs: self.ids.add(attrs['id'])
                  if tag == 'script' and 'src' in attrs: self.scripts.add(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet': self.styles.add(attrs.get('href'))
          checker = PageChecker()
          checker.feed(Path('index.html').read_text(encoding='utf-8'))
          assert './app.js' in checker.scripts
          assert './styles.css' in checker.styles
          assert {'productGrid','cartDrawer','quickQuoteForm','cartItems','categoryFilter','searchInput','heroCarousel','heroPrev','heroNext','heroSlideStatus'} <= checker.ids
          assert './catalog.js' in checker.scripts
          support = PageChecker()
          support.feed(Path('suporte.html').read_text(encoding='utf-8'))
          assert './support.js' in support.scripts and './catalog.js' in support.scripts
          assert './support.css' in support.styles
          assert {'supportGrid','supportSearch','supportType','cartDrawer','cartItems','sendQuote'} <= support.ids
          reviews = PageChecker()
          reviews.feed(Path('avaliacoes.html').read_text(encoding='utf-8'))
          assert './reviews.js' in reviews.scripts
          assert './reviews.css' in reviews.styles
          assert {'reviewForm','reviewList','ratingOptions','reviewName','reviewCity','reviewComment','reviewSubmit'} <= reviews.ids
          import json
          approved = json.loads(Path('avaliacoes.json').read_text(encoding='utf-8'))
          assert isinstance(approved,list)
          assert all(isinstance(item,dict) and item.get('approved') is True and item.get('consent') is True and item.get('rating') in (4,5) for item in approved)
          print('Área de avaliações e base moderada válidas.')
          print('Estrutura e recursos principais presentes.')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar pacote público
        run: |
          mkdir -p dist/assets
          cp index.html suporte.html avaliacoes.html styles.css support.css reviews.css app.js support.js reviews.js catalog.js avaliacoes.json robots.txt .nojekyll dist/
          cp assets/favicon.svg assets/espaco-piscina-logo.svg assets/fachada-espaco-piscina.webp dist/assets/
          cp -R assets/problemas dist/assets/
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
