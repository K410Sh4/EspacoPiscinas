name: Importar foto real da fachada (executar uma vez)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-fachada-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar arquivo da imagem aprovada
        env:
          PHOTO_SOURCE_URL: "https://at.adobe.com/Ncah1qYK6Bwcx1GR"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output assets/fachada-espaco-piscina-3072.png "$PHOTO_SOURCE_URL"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("assets/fachada-espaco-piscina-3072.png")
          data = p.read_bytes()
          if len(data) < 100000 or data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Arquivo de origem invalido ou foto incompleta")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (3072, 3072):
              raise SystemExit(f"Resolucao inesperada: {width}x{height}")
          print("Arquivo PNG valido 3072x3072", len(data), "bytes")
          PY
      - name: Gravar imagem no repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fachada-espaco-piscina-3072.png
          git commit -m "assets: incluir foto real 3072x3072 da fachada"
          git push origin HEAD:main
