name: Importar mídias de fabricantes
on:
  push:
    branches: [main]
    paths: [".github/workflows/importar-marcas.yml"]
permissions:
  contents: write
jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar otimização
        run: python -m pip install --quiet Pillow
      - name: Importar arquivos oficiais verificados
        run: |
          python - <<'PY'
          import io, pathlib, time, urllib.request
          from PIL import Image
          root=pathlib.Path("assets/marcas")
          root.mkdir(parents=True, exist_ok=True)
          photos={
              "genco-logo.webp": ("https://www.genco.com.br/downloads/logo-genco-2.png", 500),
              "genco-algicida-choque.webp": ("https://genco.com.br/imagens/produtos/produto18.jpg", 340),
              "fluidra-logo.webp": ("https://fluidra.com.br/wp-content/uploads/2021/04/Group-24.png", 450),
          }
          for name,(url,width) in photos.items():
              err=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; EspacoPiscinas/1.0)"})
                      with urllib.request.urlopen(req,timeout=40) as response: data=response.read(8_000_001)
                      if len(data)>8_000_000:raise ValueError("Imagem maior que 8MB")
                      img=Image.open(io.BytesIO(data))
                      img.verify()
                      img=Image.open(io.BytesIO(data)).convert("RGBA")
                      if not img.getbbox():raise ValueError("Imagem vazia")
                      img.thumbnail((width,width),Image.Resampling.LANCZOS)
                      img.save(root/name,"WEBP",quality=83,method=6)
                      print(name,(root/name).stat().st_size)
                      break
                  except Exception as e:
                      err=e
                      if attempt<2:time.sleep(2*(attempt+1))
              else:raise RuntimeError(f"Falha para {name}: {err}")
          PY
      - name: Versionar mídias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marcas/
          git diff --cached --check
          git commit -m "assets: incorporar mídias oficiais de fabricantes"
          git pull --rebase origin main
          git push origin HEAD:main
